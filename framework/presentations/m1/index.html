<template id="slides">
<section class="slide" data-say="Two milestones in two days. This is the story of how the Crash Records build went from an empty folder to six verified stories.">
  <p class="kicker">Milestones 0 and 1 · 10–11 November 2026</p>
  <h1>From an empty folder to a working CRIS workspace</h1>
  <div class="lane"></div>
  <p class="lede">The TxDOT Crash Records Information System service agreement: 16 stories, ship-by 24 November. In two days the portal verified six of them, every one checked against the commit that built it.</p>
  <div class="tiles">
    <div class="tile"><b>6 / 16</b><span>stories verified by the portal</span></div>
    <div class="tile"><b>300</b><span>points on this build</span></div>
    <div class="tile"><b>32</b><span>unit tests, all passing</span></div>
    <div class="tile"><b>13</b><span>days left to ship-by</span></div>
  </div>
</section>

<section class="slide" data-say="The rule we built under: Trust before intelligence. The page never shows a number, a connection or a result the project has not produced.">
  <p class="kicker">The rule</p>
  <h2>Trust before intelligence</h2>
  <div class="lane"></div>
  <p class="quote">No screen shows a number, a connection or a result the project has not actually produced.</p>
  <ul class="beats">
    <li>A system we cannot reach stays grey and says "Not checked from here".</li>
    <li>A report with no data behind it is refused, with the reason.</li>
    <li>Made-up values exist only in Sample mode, labelled on every card.</li>
    <li>Every action is written to a log that proves it was not changed afterwards.</li>
  </ul>
</section>

<section class="slide" data-say="Milestone zero: the Command Center. Nine tabs, sixty-seven cards, all reading the plan and progress files live. The portal verified it first thing on the eleventh.">
  <p class="kicker">Milestone 0 · STORY-000</p>
  <h2>The Command Center: one page for the whole build</h2>
  <div class="two">
    <ul class="beats">
      <li>9 tabs and 67 cards, each opening its own page.</li>
      <li>Reads the plan and progress files at runtime; nothing is typed into the code.</li>
      <li>Warns when the data is more than a week old.</li>
      <li><span class="pill ok">Verified</span> by the portal on 11 Nov, 50 points.</li>
    </ul>
    <figure class="shot"><img src="screens/01-overview-real.png" alt="The Command Center overview with counts from the progress file" width="1280" height="1600"><figcaption>The Overview, live on GitHub Pages</figcaption></figure>
  </div>
</section>

<section class="slide" data-say="Obi approved the proposed data model as it stood, so the eighteen tables were created, plus two the stories needed: an audit log and maintenance windows.">
  <p class="kicker">Data model</p>
  <h2>Eighteen tables created as proposed, two added by need</h2>
  <div class="two">
    <ul class="beats">
      <li>No changes were requested, so the model went in as proposed.</li>
      <li><b>AuditEntry</b> added: every Milestone 1 story has a Trust line about logging.</li>
      <li><b>MaintenanceWindow</b> added for the support and maintenance story.</li>
      <li>Every write is checked against these tables before it is stored.</li>
    </ul>
    <figure class="shot"><img src="screens/09-data-model.png" alt="The Data model tab marked Created" width="1280" height="1600"><figcaption>The Data model tab now reads "Created"</figcaption></figure>
  </div>
</section>

<section class="slide" data-say="Nine in the morning. Avery, a TxDOT user, is locked out. Avery reports it and is told at once who has it, by when, and what to try while waiting.">
  <p class="kicker">STORY-001 · Help desk</p>
  <h2>9:00. Avery is locked out of CRIS</h2>
  <div class="two">
    <ul class="beats">
      <li>Avery reports the issue in a few words and marks it high.</li>
      <li>Avery gets a reference, the person who has it, and a deadline: 8 hours.</li>
      <li>The matching help article appears straight away.</li>
      <li>A double click still makes only one ticket.</li>
    </ul>
    <figure class="shot"><img src="screens/m1-01-helpdesk-assistance.png" alt="Help for TKT-0001 naming the support person, the deadline and a help article" width="1280" height="1500"><figcaption>Assistance the moment the issue is reported</figcaption></figure>
  </div>
</section>

<section class="slide" data-say="Sam on the support desk sees every open ticket against its service level. Maintenance can only be booked outside service hours, so users are never cut off.">
  <p class="kicker">STORY-012 · Support and maintenance</p>
  <h2>Sam works the queue against the clock</h2>
  <div class="two">
    <ul class="beats">
      <li>Each ticket shows on track, at risk or breached.</li>
      <li>The ticket is resolved within its service level: <span class="pill ok">met</span></li>
      <li>A 10:00 maintenance window is refused: it would disrupt users.</li>
      <li>23:00 to 01:00 is accepted. Overdue work is flagged.</li>
    </ul>
    <figure class="shot"><img src="screens/m1-03-support-dashboard.png" alt="Support dashboard with service-level states and a scheduled maintenance window" width="1280" height="1800"><figcaption>Service levels are proposals until TxDOT confirms them</figcaption></figure>
  </div>
</section>

<section class="slide" data-say="Riley in IT runs the monitor. Real checks, real response times, around ten milliseconds. Then the outage drill: a missing file, an alert, and one incident opened.">
  <p class="kicker">STORY-002 · Monitoring</p>
  <h2>Riley's monitor catches an outage</h2>
  <div class="two">
    <div class="slide">
      <div class="chart" data-chart="ms" aria-label="Measured response times"></div>
      <p class="legend"><span><i style="background:var(--s1)"></i>Median response time, ms, measured 11 Nov</span></p>
      <p>The drill target answered <span class="pill bad">HTTP 404</span> twice (one retry), so an alert was raised and incident INC-0001 opened.</p>
    </div>
    <figure class="shot"><img src="screens/m1-04-monitoring-alert.png" alt="Monitoring page with four components up and an outage alert" width="1280" height="1300"><figcaption>It monitors this site, since CRIS is not reachable from the demo</figcaption></figure>
  </div>
</section>

<section class="slide" data-say="Jordan, a TxDOT manager, asks for a report. For an empty period the answer is no, with the reason. For today the report is computed, archived and sealed with its hash.">
  <p class="kicker">STORY-003 · Performance reports</p>
  <h2>Jordan gets a report the numbers can back</h2>
  <div class="two">
    <ul class="beats">
      <li>October 1–2: refused. "No monitoring samples between 2026-10-01 and 2026-10-02."</li>
      <li>Today: availability, response times, incidents and help desk figures.</li>
      <li>Archived once, never edited, checked against its SHA-256 on opening.</li>
    </ul>
    <figure class="shot"><img src="screens/m1-06-performance-report.png" alt="Performance report with availability bars and Matches its archived hash" width="1280" height="1500"><figcaption>"Matches its archived hash"</figcaption></figure>
  </div>
</section>

<section class="slide" data-say="Avery asks for a county filter. Casey, the developer, plans it, builds it, and can only release it after writing down how it meets the request. A request that cannot be done gets the reason.">
  <p class="kicker">STORY-004 · Feature development</p>
  <h2>Casey ships what Avery asked for</h2>
  <div class="two">
    <ul class="beats">
      <li>"Let me filter crash reports by county" becomes FC-0001.</li>
      <li>Proposed → approved → in build → released.</li>
      <li>Release is blocked until the team records how it meets the need.</li>
      <li>"Other states' data" is declined: "CRIS holds Texas crash records only."</li>
    </ul>
    <figure class="shot"><img src="screens/m1-07-feature-released.png" alt="Feature FC-0001 released with its change history" width="1280" height="1100"><figcaption>Every step in the change history</figcaption></figure>
  </div>
</section>

<section class="slide" data-say="And the proof under all of it. Every action is a line in a hash chain. We changed one stored line on purpose, and the audit page caught it at once.">
  <p class="kicker">Trust · the audit log</p>
  <h2>Change one line, and the chain says so</h2>
  <div class="two">
    <ul class="beats">
      <li>Each line carries the hash of the line before it.</li>
      <li>A record and its audit line are saved together, or neither is.</li>
      <li>Test: one stored line edited by hand.</li>
      <li>Result: <span class="pill bad">The chain is broken: line 4 was changed after it was written.</span></li>
    </ul>
    <figure class="shot"><img src="screens/m1-09-audit-tamper-detected.png" alt="Audit log reporting that line 4 was changed" width="1280" height="900"><figcaption>Tampering detected</figcaption></figure>
  </div>
</section>

<script>
(function () {
  var slides = Array.prototype.slice.call(document.getElementById('slides').content.querySelectorAll('.slide'))
    .filter(function (s) { return s.parentNode && s.parentNode.nodeType === 11; });
  var stage = document.getElementById('stage'), count = document.getElementById('count');
  var i = 0;
  var NS = 'http://www.w3.org/2000/svg';
  var tip = document.getElementById('tip');
  function el(tag, attrs, text) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); if (text != null) e.textContent = text; return e; }
  function showTip(evt, text) { tip.textContent = text; tip.hidden = false; tip.style.left = (evt.clientX + 12) + 'px'; tip.style.top = (evt.clientY + 12) + 'px'; }
  function hbars(host, rows, max, fmt) {
    var labelW = 190, w = 560, rowH = 34, h = rows.length * rowH + 10, plot = w - labelW - 60;
    var svg = el('svg', { viewBox: '0 0 ' + w + ' ' + h, role: 'img', 'aria-label': host.getAttribute('aria-label') });
    rows.forEach(function (r, k) {
      var y = 6 + k * rowH, g = el('g', {});
      g.appendChild(el('text', { x: 0, y: y + 15 }, r.label));
      if (r.total != null) g.appendChild(el('rect', { class: 'track', x: labelW, y: y + 3, width: plot * r.total / max, height: 16, rx: 4 }));
      if (r.value > 0) g.appendChild(el('rect', { class: 'fill', x: labelW, y: y + 3, width: plot * r.value / max, height: 16, rx: 4 }));
      g.appendChild(el('text', { class: 'num', x: labelW + plot * Math.max(r.value, r.total || 0) / max + 8, y: y + 15 }, fmt(r)));
      var hit = el('rect', { x: 0, y: y, width: w, height: rowH, fill: 'transparent' });
      hit.addEventListener('mousemove', function (e) { showTip(e, r.label + ': ' + fmt(r)); });
      hit.addEventListener('mouseleave', function () { tip.hidden = true; });
      g.appendChild(hit);
      svg.appendChild(g);
    });
    host.appendChild(svg);
  }
  var charts = {
    ms: function (h) { hbars(h, [{ label: 'Command Center page', value: 11 }, { label: 'Plan data', value: 10 }, { label: 'Progress data', value: 10 }, { label: 'Data manifest', value: 9 }], 12, function (r) { return r.value + ' ms'; }); },
    releases: function (h) { hbars(h, [{ label: 'STORY-000 (first)', value: 1, total: 1 }, { label: 'r0 Setup and support', value: 4, total: 4 }, { label: 'r1 Enhancement, training', value: 1, total: 2 }, { label: 'r2 Reporting, compliance', value: 0, total: 3 }, { label: 'r3 Response management', value: 0, total: 2 }, { label: 'r4 Risk and security', value: 0, total: 4 }], 4, function (r) { return r.value + ' of ' + r.total; }); },
    tests: function (h) { hbars(h, [{ label: 'Command Center data', value: 11 }, { label: 'Store and audit chain', value: 4 }, { label: '001 Help desk', value: 4 }, { label: '002 Monitoring', value: 4 }, { label: '003 Reports', value: 3 }, { label: '004 Features', value: 3 }, { label: '012 Support', value: 3 }], 11, function (r) { return String(r.value); }); }
  };
  function show(n) {
    i = Math.max(0, Math.min(slides.length - 1, n));
    var s = slides[i].cloneNode(true);
    stage.replaceChildren(s);
    s.querySelectorAll('[data-chart]').forEach(function (h) { charts[h.getAttribute('data-chart')](h); });
    count.textContent = (i + 1) + ' / ' + slides.length;
    if (location.hash !== '#s' + (i + 1)) history.replaceState(null, '', '#s' + (i + 1));
    if (tour.on) say();
  }
  document.getElementById('prev').onclick = function () { show(i - 1); };
  document.getElementById('next').onclick = function () { show(i + 1); };
  document.addEventListener('keydown', function (e) {
    if (e.target.closest && e.target.closest('input,textarea')) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') show(i + 1);
    if (e.key === 'ArrowLeft' || e.key === 'PageUp') show(i - 1);
    if (e.key === 'Escape' && tour.on) stopTour();
  });
  window.addEventListener('hashchange', function () { var m = /^#s(\d+)$/.exec(location.hash); if (m) show(+m[1] - 1); });

  // Guided tour: walks every slide with a spoken-style caption, 20 seconds each (about 4 minutes in all).
  // Male voice narrator (Web Speech API): reads each slide's caption; a slide advances when the 20 s timer has run out AND the speech has ended.
  var synth = window.speechSynthesis, canSpeak = !!synth && typeof SpeechSynthesisUtterance !== 'undefined';
  var MALE = /(male|david|mark|guy|daniel|alex|fred|george|james|ryan|christopher|eric|brian|roger|thomas|arthur|aaron|tom)/i;
  var FEMALE = /female|zira|susan|hazel|samantha|victoria|karen|aria|jenny|libby|sonia|emma|michelle|catherine/i;
  var voice = null, lowPitch = true, voiceOn = true, curUtt = null, voiceBtn = document.getElementById('tour-voice');
  try { voiceOn = localStorage.getItem('tour-voice') !== 'off'; } catch (e) {}
  function pickVoice() {
    var en = (synth.getVoices() || []).filter(function (v) { return /^en([-_]|$)/i.test(v.lang); });
    var males = en.filter(function (v) { return MALE.test(v.name) && !FEMALE.test(v.name); });
    var nf = en.filter(function (v) { return !FEMALE.test(v.name); });
    function us(a) { return a.filter(function (v) { return /^en[-_]US/i.test(v.lang); })[0] || a[0]; }
    voice = us(males) || us(nf.filter(function (v) { return v.default; })) || us(nf) || us(en) || null;
    lowPitch = !males.length;
  }
  function stopSpeech() { curUtt = null; if (canSpeak) { try { synth.cancel(); } catch (e) {} } }
  function speak(text) {
    if (!canSpeak || !voiceOn) return;
    try {
      synth.cancel();
      var u = new SpeechSynthesisUtterance(text);
      if (voice) { u.voice = voice; u.lang = voice.lang; } else u.lang = 'en-US';
      u.rate = 1; u.pitch = lowPitch ? 0.8 : 1;
      var done = function () { if (curUtt === u) curUtt = null; };
      u.onend = done; u.onerror = done;
      curUtt = u;
      synth.speak(u);
      if (tour.paused) synth.pause();
    } catch (e) { curUtt = null; }
  }
  function paintVoice() { voiceBtn.textContent = voiceOn ? 'Voice on' : 'Voice off'; voiceBtn.setAttribute('aria-pressed', String(voiceOn)); }
  if (canSpeak) {
    pickVoice();
    if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoice); else synth.onvoiceschanged = pickVoice;
    paintVoice();
    voiceBtn.onclick = function () {
      voiceOn = !voiceOn; paintVoice();
      try { localStorage.setItem('tour-voice', voiceOn ? 'on' : 'off'); } catch (e) {}
      if (!voiceOn) stopSpeech(); else if (tour.on) speak(slides[i].getAttribute('data-say'));
    };
  } else voiceBtn.hidden = true;
  var tour = { on: false, paused: false, t: 0, timer: null }, STEP = 20000;
  var cap = document.getElementById('caption'), capText = document.getElementById('caption-text'), prog = document.getElementById('prog'), pauseBtn = document.getElementById('tour-pause');
  function say() { capText.textContent = (i + 1) + ' of ' + slides.length + ' · ' + slides[i].getAttribute('data-say'); tour.t = 0; prog.style.width = '0'; speak(slides[i].getAttribute('data-say')); }
  function tick() {
    if (tour.paused) return;
    tour.t += 250; prog.style.width = Math.min(100, tour.t / STEP * 100) + '%';
    if (tour.t >= STEP && (!curUtt || tour.t >= STEP * 3)) { if (i < slides.length - 1) show(i + 1); else stopTour(); }
  }
  function startTour() { tour.on = true; tour.paused = false; pauseBtn.textContent = 'Pause'; cap.hidden = false; document.body.style.paddingBottom = '120px'; show(0); clearInterval(tour.timer); tour.timer = setInterval(tick, 250); pauseBtn.focus(); }
  function stopTour() { stopSpeech(); tour.on = false; clearInterval(tour.timer); cap.hidden = true; document.body.style.paddingBottom = ''; document.getElementById('tour-launch').focus(); }
  document.getElementById('tour-launch').onclick = startTour;
  document.getElementById('tour-stop').onclick = stopTour;
  pauseBtn.onclick = function () {
    tour.paused = !tour.paused; pauseBtn.textContent = tour.paused ? 'Resume' : 'Pause';
    if (canSpeak) { try { if (tour.paused) synth.pause(); else synth.resume(); } catch (e) {} }
  };

  var m = /^#s(\d+)$/.exec(location.hash);
  show(m ? +m[1] - 1 : 0);
})();
</script>
</body>
</html>
