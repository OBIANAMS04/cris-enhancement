<section class="slide" data-say="Story fourteen. Each part of the system has its own normal response time. The slow-response drill records a sample far above it, and an alert goes up for investigation." data-say-script="OBI: Story fourteen, performance. Every part of the system has its own normal response time, learned from its own checks.||OGE: So what counts as abnormal?||OBI: Three times the usual, and well outside its normal spread. The slow response drill does exactly that, and an alert goes up for investigation.||OGE: And when it calms down?||OBI: The alert clears itself at the next normal reading.">

  <div class="two">
    <ul class="beats">
      <li>Baseline per component: the median and spread of its own earlier checks.</li>
      <li>Alert when a reading is over 3× the median and far outside the spread.</li>

      <li>One alert per component, cleared when it is back to normal.</li>
    </ul>
