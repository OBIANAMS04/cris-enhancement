<style>
/* Layout: one slide at a time on a road-sign field: navy panel, safety-amber accent, a lane line under the title. */
:root {

  --s1: #2a78d6; --tour: #c8102e; --tour-ink: #ffffff;
  --display: "Archivo", "Arial Narrow", Arial, sans-serif;
  --body: "Source Sans 3", "Segoe UI", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e141c; --panel: #17202b; --ink: #edf1f6; --muted: #a6b1c0; --rule: #2c3846;
  --navy: #9cc0ea; --amber: #f2b441; --amber-soft: #3a2c10;
  --ok: #86d4a6; --ok-bg: #163222; --bad: #f2a0a3; --bad-bg: #3d1b1d; --idle: #4a5666;
  --s1: #3987e5; --tour: #e5383b; --tour-ink: #ffffff; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e141c; --panel: #17202b; --ink: #edf1f6; --muted: #a6b1c0; --rule: #2c3846;
  --navy: #9cc0ea; --amber: #f2b441; --amber-soft: #3a2c10;
  --ok: #86d4a6; --ok-bg: #163222; --bad: #f2a0a3; --bad-bg: #3d1b1d; --idle: #4a5666;
  --s1: #3987e5; --tour: #e5383b; --tour-ink: #ffffff; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font: 17px/1.5 var(--body); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
.wrap { max-width: 1100px; margin: 0 auto; display: grid; gap: 14px; }
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px; }
.brand { font: 800 0.8rem/1 var(--display); letter-spacing: 0.14em; text-transform: uppercase; color: var(--amber); }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
button { font: 600 0.95rem var(--body); cursor: pointer; border-radius: 8px; min-height: 40px; padding: 8px 14px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); }
button:focus-visible, a:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
.tour-launch { display: inline-flex; align-items: center; gap: 9px; background: var(--tour); color: var(--tour-ink); border-color: var(--tour); }
.tour-play { width: 16px; height: 16px; flex: none; }
.count { font: 500 0.85rem var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.stage { background: var(--panel); border: 1px solid var(--rule); border-radius: 14px; padding: clamp(18px, 4vw, 44px); min-height: 560px; display: grid; }
.slide { display: grid; gap: 18px; align-content: start; }
.kicker { font: 600 0.8rem var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); margin: 0; }
h1, h2 { font-family: var(--display); font-weight: 800; line-height: 1.08; margin: 0; text-wrap: balance; color: var(--navy); }
h1 { font-size: clamp(2rem, 5.5vw, 3.6rem); }
h2 { font-size: clamp(1.6rem, 3.6vw, 2.4rem); }
.lane { height: 6px; width: 120px; background: repeating-linear-gradient(90deg, var(--amber) 0 26px, transparent 26px 40px); }
p { margin: 0; max-width: 64ch; }
.lede { font-size: 1.2rem; color: var(--muted); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 26px; align-items: start; }
@media (max-width: 760px) { .two { grid-template-columns: 1fr; } .stage { min-height: 0; } }
.shot { margin: 0; border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; background: var(--bg); }
.shot img { display: block; width: 100%; height: auto; max-height: 420px; object-fit: cover; object-position: top; }
.shot figcaption { font-size: 0.85rem; color: var(--muted); padding: 8px 12px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--rule); border-radius: 10px; padding: 14px 16px; display: grid; gap: 4px; }
.tile b { font: 800 2.1rem/1 var(--display); color: var(--navy); font-variant-numeric: tabular-nums; }
.tile span { font-size: 0.9rem; color: var(--muted); }
.tile.ok { border-color: var(--ok); background: var(--ok-bg); }
.tile.warn { border-color: var(--amber); background: var(--amber-soft); }
.flow { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.step { border: 1px solid var(--rule); border-radius: 10px; padding: 12px 14px; display: grid; gap: 4px; position: relative; }
.step b { font: 800 1.05rem var(--display); color: var(--navy); }
.step span { font-size: 0.9rem; color: var(--muted); }
.step.ok { background: var(--ok-bg); border-color: var(--ok); }
.step.bad { background: var(--bad-bg); border-color: var(--bad); }
.cells { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.cell { border-radius: 8px; padding: 10px 12px; display: grid; gap: 2px; border: 1px solid var(--rule); }
.cell b { font: 600 0.8rem var(--mono); }
.cell span { font-size: 0.88rem; }
.cell em { font-style: normal; font-size: 0.78rem; font-weight: 600; }
.cell.pass { background: var(--ok-bg); border-color: var(--ok); }
.cell.pass em { color: var(--ok); }
.cell.na { background: var(--panel); border-style: dashed; }
.cell.na em { color: var(--muted); }
.cell.fail { background: var(--bad-bg); border-color: var(--bad); }
.cell.fail em { color: var(--bad); }
.cell:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }
ul.beats { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
ul.beats li { padding-left: 16px; border-left: 4px solid var(--amber); }
.pill { display: inline-block; font: 600 0.78rem var(--body); padding: 2px 10px; border-radius: 999px; }
.pill.ok { color: var(--ok); background: var(--ok-bg); }
.pill.bad { color: var(--bad); background: var(--bad-bg); }
.quote { font: 600 1.25rem/1.4 var(--body); border-left: 4px solid var(--navy); padding-left: 14px; }
.chart { overflow-x: auto; }
.chart svg { display: block; width: 100%; min-width: 420px; height: auto; }
.chart text { font-family: var(--body); font-size: 13px; fill: var(--ink); }
.chart .muted { fill: var(--muted); }
.chart .num { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
.chart .track { fill: var(--idle); opacity: 0.45; }
.chart .fill { fill: var(--s1); }
.chart .hit:hover + .fill, .chart g:hover .fill { opacity: 0.8; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.85rem; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--panel); font-size: 0.85rem; padding: 6px 10px; border-radius: 6px; }
table { border-collapse: collapse; width: 100%; font-size: 0.95rem; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font: 600 0.75rem var(--mono); text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
td.n { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.tbl { overflow-x: auto; }
.foot { font-size: 0.85rem; color: var(--muted); }
@media (prefers-reduced-motion: no-preference) { .slide { animation: in 0.35s ease-out; } @keyframes in { from { opacity: 0.4; transform: translateY(6px); } to { opacity: 1; transform: none; } } }
</style>

  }
  function tickGauge() {
    if (!running || paused || g.final) return;
    const now = performance.now();
    let est = g.done;
    if (g.mode === 'speech' && g.started) est += Math.min(g.len * 0.97, g.b + Math.max(0, now - g.bt) / 1000 * g.cps);
    else if (g.mode === 'timer') est += g.len * Math.min(1, (now - g.t0) / g.dur);
    const p = Math.min(0.995, est / g.total);
    if (p > g.shown) setFill(p);
  }

  // ---- Content area (everything right of the docked panel, or below the top strip) and the synced pointer.
  function area() {
    const r = panel.getBoundingClientRect(), w = html.clientWidth || innerWidth, h = innerHeight;
    return isTop() ? { l: 0, t: Math.max(0, r.bottom), r: w, b: h } : { l: Math.max(0, r.right), t: 0, r: w, b: h };
  }
  function pointFor(el) {
    const a = area(), r = el.getBoundingClientRect();
    let x = r.left + Math.min(40, r.width * 0.3), y = r.top + Math.min(24, r.height * 0.5);
    x = Math.max(a.l + 8, Math.min(x, a.r - 30));
    y = Math.max(a.t + 8, Math.min(y, a.b - 34));
    return [x, y];
  }
  let cx = 0, cy = 0, raf = 0;
  function frame() {
    raf = requestAnimationFrame(frame);
    if (anchor && anchor.isConnected) {
      const p = pointFor(anchor);
      if (reduce()) { cx = p[0]; cy = p[1]; } else { cx += (p[0] - cx) * 0.14; cy += (p[1] - cy) * 0.14; }
      const a = area();
      cx = Math.max(a.l + 8, cx); cy = Math.max(a.t + 8, cy);
      cursor.style.transform = 'translate(' + cx.toFixed(1) + 'px, ' + cy.toFixed(1) + 'px)';
    }
    tickGauge();
  }
  function click() {
    if (!anchor) return;
    const p = pointFor(anchor), r = document.createElement('span');
    r.className = 'tour-ripple';
    r.setAttribute('aria-hidden', 'true');
    r.style.left = p[0] + 'px'; r.style.top = p[1] + 'px';
    document.body.appendChild(r);
    setTimeout(() => r.remove(), 800);
    cursor.classList.remove('is-click'); void cursor.offsetWidth; cursor.classList.add('is-click');
    cursor.dataset.clicks = String((+cursor.dataset.clicks || 0) + 1);
  }
  const ITEMS = 'li, tbody tr, figure, button, .tile, .step, .cell, .card, [class*="card"], article, dl > div';
  function itemsIn(el) {
    let els = Array.prototype.filter.call(el.querySelectorAll(ITEMS), (e) => e.getClientRects().length && !panel.contains(e));
    els = els.filter((e) => !els.some((o) => o !== e && e.contains(o)));
    if (isTop()) {
      // On the top strip, never scroll the target up under the strip: only point at items already in view.
      const a = area();
      return els.filter((e) => { const r = e.getBoundingClientRect(); return r.top >= a.t && r.top < a.b - 40; });
    }
    const top = el.getBoundingClientRect().top, limit = top + Math.max(innerHeight * 1.2, 600);
    const near = els.filter((e) => e.getBoundingClientRect().top < limit);
    return near.length ? near : els.slice(0, 6);
  }
  function pick(n) {
    if (n === 0 || !items || !items.length) return target;
    const span = Math.max(1, lines.length - 2);
    return items[Math.min(items.length - 1, Math.round((n - 1) * (items.length - 1) / span))];
  }
  function reveal(el) {
    const a = area(), r = el.getBoundingClientRect();
    if (r.top < a.t + 4 || r.bottom > a.b - 4) {
      try { el.scrollIntoView({ block: r.height > a.b - a.t ? 'start' : 'nearest', behavior: reduce() ? 'auto' : 'smooth' }); } catch (e) { el.scrollIntoView(); }
    }
  }

  // ---- Panel rendering.
  function renderStop(stop) {
    $('tour-count').textContent = adapter.noun + ' ' + (idx + 1) + ' of ' + list.length;
    $('tour-title').textContent = stop.title || adapter.noun + ' ' + (idx + 1);
    const d = $('tour-desc');
    d.textContent = stop.desc && stop.lines.length > 1 ? stop.desc : '';
    d.hidden = !d.textContent;
    scriptList.replaceChildren(...lines.map((l) => {
      const li = document.createElement('li'), b = document.createElement('b');
      li.className = 'is-' + l.who.toLowerCase();
      b.textContent = l.who === 'NIA' ? 'Nia' : 'OBI';
      li.append(b, ' ', l.text);
      return li;
    }));
    btnBack.disabled = idx === 0;
    btnNext.textContent = idx === list.length - 1 ? 'Finish' : 'Next';
  }
  function renderLine(n) {
    const l = lines[n];
    capWho.textContent = l.who === 'NIA' ? 'Nia' : 'OBI';
    capWho.className = 'tour-who is-' + l.who.toLowerCase();
    capLine.textContent = l.text;
    Array.prototype.forEach.call(scriptList.children, (li, k) => { li.classList.toggle('is-now', k === n); if (k === n) li.setAttribute('aria-current', 'true'); else li.removeAttribute('aria-current'); });
  }

  // ---- Playback.
  function startStop(k) {
    if (!list.length) return;
    k = Math.max(0, Math.min(list.length - 1, k));
    tok++; clearTimers(); cancelSpeech();
    idx = k;
    const stop = list[k];
    lines = stop.lines.length ? stop.lines : [{ who: 'OBI', text: stop.title || adapter.noun + ' ' + (k + 1) }];
    g = { shown: 0, done: 0, total: Math.max(1, lines.reduce((s, l) => s + l.text.length, 0)), len: 0, mode: 'idle', started: false, b: 0, bt: 0, cps: 14, t0: 0, dur: 1, final: false };
    setFill(0);
    renderStop(stop);
    renderLine(0);
    if (target) target.classList.remove('tour-target');
    target = adapter.bring(stop, k);
    target.classList.add('tour-target');
    items = null; anchor = target; lineIdx = 0; phase = 'line';
    try { target.scrollIntoView({ block: 'start', behavior: reduce() ? 'auto' : 'smooth' }); } catch (e) { target.scrollIntoView(); }
    const t = tok;
    if (!paused) later(() => settle(t, () => playLine(0)), reduce() ? 200 : START_DELAY);
  }
  // Wait until the page has stopped scrolling (smooth scrolls on long pages), so later scrolls do not cut it short.
  function settle(t, fn) {
    let last = -1, still = 0;
    const t0 = performance.now();
    const step = () => {
      if (t !== tok) return;
      const key = Math.round(window.scrollY) + ':' + (target ? Math.round(target.getBoundingClientRect().top) : 0);
      still = key === last ? still + 1 : 0;
      last = key;
      if (still >= 6 || performance.now() - t0 > 2500) fn(); else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function playLine(n) {
    clearTimers();
    const t = ++tok;
    lineIdx = n; phase = 'line';
    const line = lines[n];
    g.len = line.text.length; g.started = false; g.final = false; g.b = 0;
    renderLine(n);
    if (n === 0) anchor = target;
    else { if (!items) items = itemsIn(target); anchor = pick(n); if (!isTop()) reveal(anchor); }
    if (voiceOn && canSpeak && !speechBroken) speakLine(t, n, line); else timerLine(t, n, line);
  }
  function timerLine(t, n, line) {
    g.mode = 'timer'; g.t0 = performance.now(); g.dur = Math.max(1200, line.text.length / READ_CPS * 1000);
    click();
    later(() => lineDone(t, n), g.dur);
  }
  function speakLine(t, n, line) {
    let u;
    try { u = new SpeechSynthesisUtterance(line.text); } catch (e) { timerLine(t, n, line); return; }
    pickVoices();
    const nia = line.who === 'NIA', v = nia ? cast.nia : cast.obi;
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.pitch = nia ? cast.niaPitch : cast.obiPitch;
    u.rate = nia ? 1.0 : 0.95;
    g.mode = 'speech'; g.cps = 14 * u.rate;
    const begin = () => { if (!g.started) { g.started = true; g.bt = performance.now(); click(); } };
    u.onstart = () => { if (t === tok) begin(); };
    u.onboundary = (e) => { if (t !== tok) return; begin(); g.b = Math.max(g.b, Math.min(g.len, e.charIndex || 0)); g.bt = performance.now(); };
    u.onend = () => { if (t === tok) lineDone(t, n); };
    u.onerror = (e) => {
      if (t !== tok) return;
      if (e && (e.error === 'interrupted' || e.error === 'canceled')) return;
      const t2 = ++tok; timerLine(t2, n, line);
    };
    keepUtt = u;
    try { synth.cancel(); } catch (e) {}
    later(() => { if (t !== tok) return; try { synth.speak(u); } catch (e) { const t2 = ++tok; timerLine(t2, n, line); } }, 40);
    // Some browsers expose speechSynthesis but never speak (no voices, blocked audio): fall back to reading time.
    later(() => {
      if (t !== tok || g.started) return;
      speechBroken = true;
      const t2 = ++tok; cancelSpeech(); timerLine(t2, n, line);
    }, 3500);
  }
  function lineDone(t, n) {
    if (t !== tok) return;
    clearTimers();
    g.done += g.len;
    g.mode = 'idle'; g.started = false; g.b = 0;
    const t2 = ++tok;
    if (n + 1 < lines.length) {
      lineIdx = n + 1;
      later(() => { if (t2 === tok) playLine(n + 1); }, 120);
    } else {
      g.final = true; setFill(1); phase = 'after';
      later(() => { if (t2 === tok) advance(); }, PAUSE_AFTER);
    }
  }
  const advance = () => (idx + 1 < list.length ? startStop(idx + 1) : end());
  function go(k) { if (k >= list.length) end(); else startStop(Math.max(0, k)); }
  function setPaused(p) {
    paused = p;
    btnPause.textContent = p ? 'Resume' : 'Pause';
    btnPause.setAttribute('aria-pressed', String(p));
    panel.classList.toggle('is-paused', p);
    if (p) { tok++; clearTimers(); cancelSpeech(); }
    else if (phase === 'after') advance();
    else playLine(lineIdx);
  }

  // ---- Docking: the panel is a fixed left column and the page reflows beside it (html.tour-on adds the padding);
  // under 700px it is a strip at the top and the page is pushed down by its measured height.
  function syncStrip() { if (running) html.style.setProperty('--tour-strip', Math.ceil(panel.getBoundingClientRect().height) + 'px'); }
  let ro = null;
  try { ro = new ResizeObserver(syncStrip); } catch (e) { ro = null; }
  function start() {
    list = adapter.stops();
    if (!list.length) return;
    running = true; speechBroken = false;
    panel.hidden = false; cursor.hidden = false;
    if (launch) launch.hidden = true;
    html.classList.add('tour-on');
    syncStrip();
    if (ro) ro.observe(panel);
    paused = false;
    btnPause.textContent = 'Pause';
    btnPause.setAttribute('aria-pressed', 'false');
    panel.classList.remove('is-paused');
    const a = area();
    cx = a.l + 24; cy = isTop() ? a.t + 24 : innerHeight * 0.45;
    if (!raf) raf = requestAnimationFrame(frame);
    startStop(0);
    try { btnPause.focus({ preventScroll: true }); } catch (e) {}
  }
  function end() {
    if (!running) return;
    running = false; paused = false; tok++;
    clearTimers(); cancelSpeech();
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    if (ro) ro.disconnect();
    html.classList.remove('tour-on');
    html.style.removeProperty('--tour-strip');
    if (target) target.classList.remove('tour-target');
    target = null; anchor = null; items = null;
    panel.hidden = true; cursor.hidden = true;
    if (launch) { launch.hidden = false; try { launch.focus({ preventScroll: true }); } catch (e) {} }
  }

  if (launch) launch.addEventListener('click', () => (running ? end() : start()));
  btnBack.addEventListener('click', () => go(idx - 1));
  btnNext.addEventListener('click', () => go(idx + 1));
  btnPause.addEventListener('click', () => setPaused(!paused));
  btnClose.addEventListener('click', end);
  btnVoice.addEventListener('click', () => {
    if (!canSpeak) return;
    voiceOn = !voiceOn; speechBroken = false; paintVoice();
    try { localStorage.setItem('tour-voice', voiceOn ? 'on' : 'off'); } catch (e) {}
    if (running && !paused && phase === 'line') { tok++; clearTimers(); cancelSpeech(); playLine(lineIdx); }
  });
  const typing = (el) => !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName || ''));
  window.addEventListener('keydown', (e) => {
    if (!running || typing(e.target) || e.altKey || e.ctrlKey || e.metaKey) return;
    let used = true;
    if (e.key === 'ArrowRight') go(idx + 1);
    else if (e.key === 'ArrowLeft') go(idx - 1);
    else if (e.key === ' ' || e.key === 'Spacebar') { if (!e.repeat) setPaused(!paused); }
    else if (e.key === 'Escape') end();
    else used = false;
    if (used) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  window.addEventListener('keyup', (e) => { if (running && (e.key === ' ' || e.key === 'Spacebar') && !typing(e.target)) { e.preventDefault(); e.stopPropagation(); } }, true);
  addEventListener('resize', syncStrip);
  if (mode === 'deck') window.__deckOnShow = (n) => { if (running && !bringing && n !== idx) startStop(n); };
  window.__tour = { start, end, state: () => ({ running, paused, idx, lineIdx, phase, count: list.length, lines: lines.length, voice: cast.obi && cast.obi.name, nia: cast.nia && cast.nia.name, obiPitch: cast.obiPitch, niaPitch: cast.niaPitch }) };
})();
</script>
<!-- deck-tour end -->
