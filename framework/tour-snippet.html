<!-- Guided tour. Standing rules (Obi): 2026-11-10 every framework page, artifact and presentation carries a red
     "Take the guided tour" button (fixed, bottom-right); 2026-11-11 a play icon on it; 2026-11-11 a male voice narrator;
     2026-11-12 OBI two-host narration, docked side panel, gauge synced to the voice, pointer synced to the voice;
     2026-11-14 the co-host is Oge, a fixed control bar that never covers the dialogue, and pointer pacing that keeps moving
     with the voice even when the browser sends no word 'boundary' events.
     Use: paste this block at the end of a page. Mark each stop with data-tour="short description" (optional
     data-tour-title="Short title") and its dialogue in data-tour-script="OBI: line || OGE: line || OBI: line" (2 to 4 short
     lines, OBI first; the first stop opens "Hi, I am OBI."). Without data-tour-script, OBI reads the data-tour text. Stops run
     in document order. No libraries; light and dark; safe in a sandboxed iframe (no alert/confirm, storage in try/catch).
     Voices (Web Speech API): OBI = first natural/online male (Andrew, Guy, Christopher, Eric, Davis, Brian, Roger, Steffan,
     Ryan, Thomas), else Google UK English Male, else Microsoft David/Mark, else any English voice not on the female list;
     pitch 0.82 (0.75 if not natural), rate 0.95. Oge = a different voice (Jenny/Aria/Ava/Emma natural, else Google US
     English, else Zira), pitch 1.0, rate 1.0; with only one voice she uses it at pitch 1.15. Voice on/off is remembered.
     Layout: the panel docks to the left (clamp(260px, 26vw, 360px)) and html.tour-on pads the page so it reflows beside it;
     under 700px it is a strip at the top that pushes the page down. Inside the panel everything is one vertical column in
     normal flow: a two-line header, the title, the gauge, the dialogue (current line, then the transcript) which takes the
     remaining height and scrolls inside itself, and a control bar at the bottom that wraps onto two rows when narrow. Nothing
     is absolutely positioned, so the buttons can never sit on top of the text at any browser zoom.
     Pacing: one clock per line drives the gauge and the pointer. It follows the voice's 'boundary' events when they arrive,
     else a word-timing estimate (2.6 words a second at rate 0.95, re-measured from each spoken line). The pointer glides to
     the line's target and clicks as the line starts, then walks the line's items and sweeps along each one as the words go
     by, so it never stands still while someone is talking. The gauge reaches 100% only on the last line's 'end'; voice off,
     it runs at 15 characters a second. Pause freezes both. Keys: Left/Right move, Space pauses, Esc closes. -->

<script>
(() => {
  'use strict';
  const panel = document.getElementById('tour-panel');
  if (!panel || panel.dataset.ready) return;
  panel.dataset.ready = '1';
  const mode = panel.getAttribute('data-mode') || 'page';
  const $ = (id) => document.getElementById(id);
  const html = document.documentElement;
  const launch = $('tour-launch'), cursor = $('tour-cursor'), gauge = $('tour-gauge'), fill = $('tour-fill');
  const capWho = $('tour-who'), capLine = $('tour-line'), scriptList = $('tour-script'), dialog = $('tour-dialog');
  const btnBack = $('tour-back'), btnPause = $('tour-pause'), btnNext = $('tour-next'), btnClose = $('tour-close'), btnVoice = $('tour-voice');
  const PAUSE_AFTER = 600, READ_CPS = 15, START_DELAY = 350, GLIDE = 380;
  const mq = (q) => { try { return matchMedia(q).matches; } catch (e) { return false; } };
  const reduce = () => mq('(prefers-reduced-motion: reduce)');
  const isTop = () => mq('(max-width: 699.98px)');

  // ---- Voices: OBI leads (male, natural, low), Oge answers (a different, preferably natural voice).
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  const canSpeak = !!synth && typeof window.SpeechSynthesisUtterance === 'function';
  const MALE = ['andrew', 'guy', 'christopher', 'eric', 'davis', 'brian', 'roger', 'steffan', 'ryan', 'thomas'];
  const OGE_NAMES = ['jenny', 'aria', 'ava', 'emma'];
  const FEMALE = /\b(zira|susan|hazel|samantha|victoria|karen|aria|jenny|libby|sonia|emma|michelle|catherine|ava|emily|female)\b/i;
  const NATURAL = /natural|online/i;
  const named = (v, n) => new RegExp('\\b' + n + '\\b', 'i').test(v.name || '');
  let cast = { obi: null, oge: null, obiPitch: 0.75, ogePitch: 1.15 };
  function pickVoices() {
    let all = [];
    try { all = (synth && synth.getVoices()) || []; } catch (e) { all = []; }
    const en = all.filter((v) => /^en([-_]|$)/i.test(v.lang || ''));
    const pool = en.length ? en : all;
    let obi = null, natural = false;
    for (const n of MALE) { obi = pool.find((v) => NATURAL.test(v.name) && named(v, n)); if (obi) { natural = true; break; } }
    obi = obi || pool.find((v) => /google uk english male/i.test(v.name)) || pool.find((v) => /microsoft (david|mark)\b/i.test(v.name))
      || pool.find((v) => !FEMALE.test(v.name)) || pool[0] || null;
    let oge = null;
    for (const n of OGE_NAMES) { oge = pool.find((v) => v !== obi && NATURAL.test(v.name) && named(v, n)); if (oge) break; }
    oge = oge || pool.find((v) => v !== obi && /google us english/i.test(v.name)) || pool.find((v) => v !== obi && /zira/i.test(v.name))
      || pool.find((v) => v !== obi && FEMALE.test(v.name)) || pool.find((v) => v !== obi) || obi;
    cast = { obi, oge, obiPitch: natural ? 0.82 : 0.75, ogePitch: oge === obi ? 1.15 : 1.0 };
  }
  if (canSpeak) {
    pickVoices();
    try { if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoices); else synth.onvoiceschanged = pickVoices; } catch (e) {}
  }

  try { voiceOn = localStorage.getItem('tour-voice') !== 'off'; } catch (e) {}
  const paintVoice = () => {
    if (!canSpeak) { btnVoice.textContent = 'No voice'; btnVoice.disabled = true; btnVoice.setAttribute('aria-pressed', 'false'); return; }
    btnVoice.textContent = voiceOn ? 'Voice on' : 'Voice off';
    btnVoice.setAttribute('aria-pressed', String(voiceOn));

  paintVoice();

  // ---- Stops. Dialogue: "OBI: text || OGE: text || ...". Without a script, OBI reads the short description.
  function parse(script, fallback) {
    const out = [];
    String(script || '').split('||').forEach((raw) => {
      const s = raw.trim();
      if (!s) return;
      const m = /^(OBI|OGE)\s*:\s*([\s\S]*)$/i.exec(s);
      out.push(m ? { who: m[1].toUpperCase(), text: m[2].trim() } : { who: 'OBI', text: s });
    });
    if (!out.length && fallback && fallback.trim()) out.push({ who: 'OBI', text: fallback.trim() });
    return out.filter((l) => l.text);
  }
  const clean = (s) => String(s || '').replace(/\s+/g, ' ').trim();
  const wordCount = (s) => (String(s || '').match(/\S+/g) || []).length;
  let bringing = false;
  const adapter = mode === 'deck' ? {
    noun: 'Slide',
    stops() {
      const D = window.__deck;
      if (!D) return [];
      return D.slides.map((s, k) => {
        const h = s.querySelector('h1, h2');
        const title = clean(h && h.textContent) || 'Slide ' + (k + 1);
        return { title, desc: '', lines: parse(s.getAttribute('data-say-script'), s.getAttribute('data-say') || title) };
      });
    },
    bring(stop, k) {
      const D = window.__deck;
      bringing = true;
      try { if (D.index() !== k) D.go(k); } finally { bringing = false; }
      return D.stage;
    }
  } : {
    noun: 'Stop',
    stops() {
      return Array.prototype.filter.call(document.querySelectorAll('[data-tour]'), (el) => el.getClientRects().length && !panel.contains(el))
        .map((el) => {
          const h = el.querySelector('h1, h2, h3');
          const desc = el.getAttribute('data-tour') || '';
          return { el, title: el.getAttribute('data-tour-title') || clean(h && h.textContent) || '', desc, lines: parse(el.getAttribute('data-tour-script'), desc) };
        });

    bring(stop) { return stop.el; }
  };

  let running = false, paused = false, list = [], idx = 0, lines = [], lineIdx = 0, phase = 'line', tok = 0;
  let target = null, items = null, anchor = null, speechBroken = false, keepUtt = null;
  const timers = new Set();
  const later = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; };
  const clearTimers = () => { timers.forEach((id) => clearTimeout(id)); timers.clear(); };

  // ---- Pacing. One clock per line (L) drives both the gauge and the pointer. Progress p (0..1) follows 'boundary'
  // events when the voice sends them, else a word-timing estimate: wpr words a second per unit of rate (2.6 at 0.95),
  // re-measured from every line that is spoken to its end. p never goes back and stays below 0.97 until 'end'.
  let wpr = 2.6 / 0.95;
  let L = { mode: 'idle', words: 1, len: 1, text: '', rate: 1, t0: 0, spoke: 0, started: false, bw: -1, bt: 0, dur: 1, p: 0, subs: [], sub: -1 };
  let g = { shown: 0, done: 0, total: 1, final: false };
  function setFill(p) {
    g.shown = p;
    fill.style.transform = 'scaleX(' + p + ')';
    gauge.setAttribute('aria-valuenow', String(Math.floor(p * 100)));
    gauge.dataset.progress = String(p);
  }
  function lineProgress(now) {
    if (L.mode === 'timer') return Math.min(1, (now - L.t0) / L.dur);
    if (L.mode !== 'speech' || now < L.t0) return 0;
    const wps = wpr * L.rate;
    const w = L.bw >= 0 ? L.bw + Math.min(1.5, (now - L.bt) / 1000 * wps) : (now - L.t0) / 1000 * wps;
    return Math.min(0.97, w / Math.max(1, L.words));
  }
  function tickPace(now) {
    if (!running || paused || g.final || phase !== 'line') return;
    L.p = Math.max(L.p, lineProgress(now));
    const p = Math.min(0.995, (g.done + L.p * L.len) / g.total);
    if (p > g.shown) setFill(p);
  }

  // ---- Content area (everything right of the docked panel, or below the top strip) and the synced pointer.
  function area() {
    const r = panel.getBoundingClientRect(), w = html.clientWidth || innerWidth, h = innerHeight;
    return isTop() ? { l: 0, t: Math.max(0, r.bottom), r: w, b: h } : { l: Math.max(0, r.right), t: 0, r: w, b: h };
  }
  // A point on el: u (0..1) sweeps along the element as its words are spoken, like a finger following the text.
  function pointOn(el, u) {
    const a = area(), r = el.getBoundingClientRect();
    const span = Math.max(40, Math.min(r.width * 0.6, 240));
    let x = r.left + Math.min(28, r.width * 0.2) + span * u;
    let y = r.top + Math.min(22, r.height * 0.5) + (r.height > 80 ? Math.min(r.height * 0.25, 36) * u : 0);
    x = Math.max(a.l + 8, Math.min(x, a.r - 30));
    y = Math.max(a.t + 8, Math.min(y, a.b - 34));
    return [x, y];
  }

  const ease = (k) => 1 - Math.pow(1 - k, 3);
  function frame(now) {

    now = performance.now();
    tickPace(now);

    const live = running && !paused && phase === 'line' && L.mode !== 'idle';
    // Which of the line's items the voice has reached, and how far along it.
    let u = lastU;
    if (live) {
      const k = L.subs.length, f = L.p * k, j = Math.min(k - 1, Math.floor(f));
      u = Math.min(1, f - j);
      if (j !== L.sub) { L.sub = j; anchor = L.subs[j]; glide = { x: cx, y: cy, t0: now }; if (j > 0 && !isTop()) reveal(anchor); }
      lastU = u;
    }
