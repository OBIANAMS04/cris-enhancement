<!-- Guided tour. Standing rules (Obi): 2026-11-10 every framework page, artifact and presentation carries a red
     "Take the guided tour" button (fixed, bottom-right); 2026-11-11 a play icon on it; 2026-11-11 a male voice narrator;
     2026-11-12 OBI two-host narration, docked side panel, gauge synced to the voice, pointer synced to the voice.
     Use: paste this block at the end of a page. Mark each stop with data-tour="short description" (optional
     data-tour-title="Short title") and its dialogue in data-tour-script="OBI: line || NIA: line || OBI: line" (2 to 4 short
     lines, OBI first; the first stop opens "Hi, I am OBI."). Without data-tour-script, OBI reads the data-tour text. Stops run
     in document order. No libraries; light and dark; safe in a sandboxed iframe (no alert/confirm, storage in try/catch).
     Voices (Web Speech API): OBI = first natural/online male (Andrew, Guy, Christopher, Eric, Davis, Brian, Roger, Steffan,
     Ryan, Thomas), else Google UK English Male, else Microsoft David/Mark, else any English voice not on the female list;
     pitch 0.82 (0.75 if not natural), rate 0.95. Nia = a different voice (Jenny/Aria/Ava/Emma natural, else Google US
     English, else Zira), pitch 1.0, rate 1.0; with only one voice she uses it at pitch 1.15. Voice on/off is remembered.
     Layout: the panel docks to the left (about 320px, own scroll) and html.tour-on pads the page so it reflows beside it;
     under 700px it is a strip at the top that pushes the page down. Nothing covers the narrated content; the target is
     outlined in place. The gauge fills with the speech (boundary events) and reaches 100% only on the last line's end;
     voice off, it runs at 15 characters a second. The pointer glides to the target, clicks when OBI starts, then clicks
     the next item (list item, row, figure, card, button) at each line. Keys: Left/Right move, Space pauses, Esc closes. -->

<script>
(() => {
  'use strict';
  const panel = document.getElementById('tour-panel');
  if (!panel || panel.dataset.ready) return;
  panel.dataset.ready = '1';
  const mode = panel.getAttribute('data-mode') || 'page';
  const $ = (id) => document.getElementById(id);
  const html = document.documentElement;
  const launch = $('tour-launch'), cursor = $('tour-cursor'), gauge = $('tour-gauge'), fill = $('tour-fill');
  const capWho = $('tour-who'), capLine = $('tour-line'), scriptList = $('tour-script');
  const btnBack = $('tour-back'), btnPause = $('tour-pause'), btnNext = $('tour-next'), btnClose = $('tour-close'), btnVoice = $('tour-voice');
  const PAUSE_AFTER = 600, READ_CPS = 15, START_DELAY = 650;
  const mq = (q) => { try { return matchMedia(q).matches; } catch (e) { return false; } };
  const reduce = () => mq('(prefers-reduced-motion: reduce)');
  const isTop = () => mq('(max-width: 699.98px)');

  // ---- Voices: OBI leads (male, natural, low), Nia answers (a different, preferably natural female voice).
  const synth = 'speechSynthesis' in window ? window.speechSynthesis : null;
  const canSpeak = !!synth && typeof window.SpeechSynthesisUtterance === 'function';
  const MALE = ['andrew', 'guy', 'christopher', 'eric', 'davis', 'brian', 'roger', 'steffan', 'ryan', 'thomas'];
  const NIA_NAMES = ['jenny', 'aria', 'ava', 'emma'];
  const FEMALE = /\b(zira|susan|hazel|samantha|victoria|karen|aria|jenny|libby|sonia|emma|michelle|catherine|ava|emily|female)\b/i;
  const NATURAL = /natural|online/i;
  const named = (v, n) => new RegExp('\\b' + n + '\\b', 'i').test(v.name || '');
  let cast = { obi: null, nia: null, obiPitch: 0.75, niaPitch: 1.15 };
  function pickVoices() {
    let all = [];
    try { all = (synth && synth.getVoices()) || []; } catch (e) { all = []; }
    const en = all.filter((v) => /^en([-_]|$)/i.test(v.lang || ''));
    const pool = en.length ? en : all;
    let obi = null, natural = false;
    for (const n of MALE) { obi = pool.find((v) => NATURAL.test(v.name) && named(v, n)); if (obi) { natural = true; break; } }
    obi = obi || pool.find((v) => /google uk english male/i.test(v.name)) || pool.find((v) => /microsoft (david|mark)\b/i.test(v.name))
      || pool.find((v) => !FEMALE.test(v.name)) || pool[0] || null;
    let nia = null;
    for (const n of NIA_NAMES) { nia = pool.find((v) => v !== obi && NATURAL.test(v.name) && named(v, n)); if (nia) break; }
    nia = nia || pool.find((v) => v !== obi && /google us english/i.test(v.name)) || pool.find((v) => v !== obi && /zira/i.test(v.name))
      || pool.find((v) => v !== obi && FEMALE.test(v.name)) || pool.find((v) => v !== obi) || obi;
    cast = { obi, nia, obiPitch: natural ? 0.82 : 0.75, niaPitch: nia === obi ? 1.15 : 1.0 };
  }
  if (canSpeak) {
    pickVoices();
    try { if (synth.addEventListener) synth.addEventListener('voiceschanged', pickVoices); else synth.onvoiceschanged = pickVoices; } catch (e) {}
  }
  let voiceOn = true;
  try { voiceOn = localStorage.getItem('tour-voice') !== 'off'; } catch (e) {}
  const paintVoice = () => {
    if (!canSpeak) { btnVoice.textContent = 'No voice in this browser'; btnVoice.disabled = true; btnVoice.setAttribute('aria-pressed', 'false'); return; }
    btnVoice.textContent = voiceOn ? 'Voice on' : 'Voice off';
    btnVoice.setAttribute('aria-pressed', String(voiceOn));
  };
  paintVoice();

  // ---- Stops. Dialogue: "OBI: text || NIA: text || ...". Without a script, OBI reads the short description.
  function parse(script, fallback) {
    const out = [];
    String(script || '').split('||').forEach((raw) => {
      const s = raw.trim();
      if (!s) return;
      const m = /^(OBI|NIA)\s*:\s*([\s\S]*)$/i.exec(s);
      out.push(m ? { who: m[1].toUpperCase(), text: m[2].trim() } : { who: 'OBI', text: s });
    });
    if (!out.length && fallback && fallback.trim()) out.push({ who: 'OBI', text: fallback.trim() });
    return out.filter((l) => l.text);
  }
  const clean = (s) => String(s || '').replace(/\s+/g, ' ').trim();
  let bringing = false;
  const adapter = mode === 'deck' ? {
    noun: 'Slide',
    stops() {
      const D = window.__deck;
      if (!D) return [];
      return D.slides.map((s, k) => {
        const h = s.querySelector('h1, h2');
        const title = clean(h && h.textContent) || 'Slide ' + (k + 1);
        return { title, desc: '', lines: parse(s.getAttribute('data-say-script'), s.getAttribute('data-say') || title) };
      });
    },
    bring(stop, k) {
      const D = window.__deck;
      bringing = true;
      try { if (D.index() !== k) D.go(k); } finally { bringing = false; }
      return D.stage;
    }
  } : {
    noun: 'Stop',
    stops() {
      return Array.prototype.filter.call(document.querySelectorAll('[data-tour]'), (el) => el.getClientRects().length && !panel.contains(el))
        .map((el) => {
          const h = el.querySelector('h1, h2, h3');
          const desc = el.getAttribute('data-tour') || '';
          return { el, title: el.getAttribute('data-tour-title') || clean(h && h.textContent) || '', desc, lines: parse(el.getAttribute('data-tour-script'), desc) };
        });
    },
    bring(stop) { return stop.el; }
  };

  // ---- State. Every async callback carries the token it was started with; a newer token cancels it.
  let running = false, paused = false, list = [], idx = 0, lines = [], lineIdx = 0, phase = 'line', tok = 0;
  let target = null, items = null, anchor = null, speechBroken = false, keepUtt = null;
  const timers = new Set();
  const later = (fn, ms) => { const id = setTimeout(() => { timers.delete(id); fn(); }, ms); timers.add(id); return id; };
  const clearTimers = () => { timers.forEach((id) => clearTimeout(id)); timers.clear(); };
  const cancelSpeech = () => { keepUtt = null; if (canSpeak) { try { synth.cancel(); } catch (e) {} } };

  // ---- Gauge: filled by speech (boundary charIndex over the stop's characters), eased between events,
  // held below 100% until the last line's 'end'. With voice off it runs on reading time (15 characters a second).
  let g = { shown: 0, done: 0, total: 1, len: 0, mode: 'idle', started: false, b: 0, bt: 0, cps: 14, t0: 0, dur: 1, final: false };
  function setFill(p) {

    fill.style.transform = 'scaleX(' + p + ')';
    gauge.setAttribute('aria-valuenow', String(Math.floor(p * 100)));
    gauge.dataset.progress = String(p);
  }
  function tickGauge() {
    if (!running || paused || g.final) return;
    const now = performance.now();
    let est = g.done;
    if (g.mode === 'speech' && g.started) est += Math.min(g.len * 0.97, g.b + Math.max(0, now - g.bt) / 1000 * g.cps);
    else if (g.mode === 'timer') est += g.len * Math.min(1, (now - g.t0) / g.dur);
    const p = Math.min(0.995, est / g.total);
    if (p > g.shown) setFill(p);
  }

  // ---- Content area (everything right of the docked panel, or below the top strip) and the synced pointer.
  function area() {
    const r = panel.getBoundingClientRect(), w = html.clientWidth || innerWidth, h = innerHeight;
    return isTop() ? { l: 0, t: Math.max(0, r.bottom), r: w, b: h } : { l: Math.max(0, r.right), t: 0, r: w, b: h };

  function pointFor(el) {
    const a = area(), r = el.getBoundingClientRect();
    let x = r.left + Math.min(40, r.width * 0.3), y = r.top + Math.min(24, r.height * 0.5);
    x = Math.max(a.l + 8, Math.min(x, a.r - 30));
    y = Math.max(a.t + 8, Math.min(y, a.b - 34));
    return [x, y];
  }
  let cx = 0, cy = 0, raf = 0;
  function frame() {
    raf = requestAnimationFrame(frame);
    if (anchor && anchor.isConnected) {
      const p = pointFor(anchor);
      if (reduce()) { cx = p[0]; cy = p[1]; } else { cx += (p[0] - cx) * 0.14; cy += (p[1] - cy) * 0.14; }

      cx = Math.max(a.l + 8, cx); cy = Math.max(a.t + 8, cy);
      cursor.style.transform = 'translate(' + cx.toFixed(1) + 'px, ' + cy.toFixed(1) + 'px)';
    }
    tickGauge();
  }
  function click() {
    if (!anchor) return;
    const p = pointFor(anchor), r = document.createElement('span');
    r.className = 'tour-ripple';
    r.setAttribute('aria-hidden', 'true');
    r.style.left = p[0] + 'px'; r.style.top = p[1] + 'px';
    document.body.appendChild(r);

    cursor.dataset.clicks = String((+cursor.dataset.clicks || 0) + 1);
  }
  const ITEMS = 'li, tbody tr, figure, button, .tile, .step, .cell, .card, [class*="card"], article, dl > div';
  function itemsIn(el) {
    let els = Array.prototype.filter.call(el.querySelectorAll(ITEMS), (e) => e.getClientRects().length && !panel.contains(e));
    els = els.filter((e) => !els.some((o) => o !== e && e.contains(o)));
    if (isTop()) {
      // On the top strip, never scroll the target up under the strip: only point at items already in view.
      const a = area();
      return els.filter((e) => { const r = e.getBoundingClientRect(); return r.top >= a.t && r.top < a.b - 40; });
    }
    const top = el.getBoundingClientRect().top, limit = top + Math.max(innerHeight * 1.2, 600);

    return near.length ? near : els.slice(0, 6);
  }
  function pick(n) {
    if (n === 0 || !items || !items.length) return target;
    const span = Math.max(1, lines.length - 2);
    return items[Math.min(items.length - 1, Math.round((n - 1) * (items.length - 1) / span))];
  }
  function reveal(el) {
    const a = area(), r = el.getBoundingClientRect();
    if (r.top < a.t + 4 || r.bottom > a.b - 4) {
      try { el.scrollIntoView({ block: r.height > a.b - a.t ? 'start' : 'nearest', behavior: reduce() ? 'auto' : 'smooth' }); } catch (e) { el.scrollIntoView(); }
    }
  }

  // ---- Panel rendering.
  function renderStop(stop) {
    $('tour-count').textContent = adapter.noun + ' ' + (idx + 1) + ' of ' + list.length;
    $('tour-title').textContent = stop.title || adapter.noun + ' ' + (idx + 1);
    const d = $('tour-desc');
    d.textContent = stop.desc && stop.lines.length > 1 ? stop.desc : '';
    d.hidden = !d.textContent;
    scriptList.replaceChildren(...lines.map((l) => {
      const li = document.createElement('li'), b = document.createElement('b');
      li.className = 'is-' + l.who.toLowerCase();
      b.textContent = l.who === 'NIA' ? 'Nia' : 'OBI';
      li.append(b, ' ', l.text);
      return li;
    }));
    btnBack.disabled = idx === 0;
    btnNext.textContent = idx === list.length - 1 ? 'Finish' : 'Next';
  }
  function renderLine(n) {
    const l = lines[n];
    capWho.textContent = l.who === 'NIA' ? 'Nia' : 'OBI';
    capWho.className = 'tour-who is-' + l.who.toLowerCase();
    capLine.textContent = l.text;
    Array.prototype.forEach.call(scriptList.children, (li, k) => { li.classList.toggle('is-now', k === n); if (k === n) li.setAttribute('aria-current', 'true'); else li.removeAttribute('aria-current'); });
  }

  // ---- Playback.
  function startStop(k) {
    if (!list.length) return;
    k = Math.max(0, Math.min(list.length - 1, k));
    tok++; clearTimers(); cancelSpeech();
    idx = k;
    const stop = list[k];
    lines = stop.lines.length ? stop.lines : [{ who: 'OBI', text: stop.title || adapter.noun + ' ' + (k + 1) }];
    g = { shown: 0, done: 0, total: Math.max(1, lines.reduce((s, l) => s + l.text.length, 0)), len: 0, mode: 'idle', started: false, b: 0, bt: 0, cps: 14, t0: 0, dur: 1, final: false };
    setFill(0);
    renderStop(stop);
    renderLine(0);
    if (target) target.classList.remove('tour-target');
    target = adapter.bring(stop, k);
    target.classList.add('tour-target');
    items = null; anchor = target; lineIdx = 0; phase = 'line';
    try { target.scrollIntoView({ block: 'start', behavior: reduce() ? 'auto' : 'smooth' }); } catch (e) { target.scrollIntoView(); }
    const t = tok;
    if (!paused) later(() => settle(t, () => playLine(0)), reduce() ? 200 : START_DELAY);
  }
  // Wait until the page has stopped scrolling (smooth scrolls on long pages), so later scrolls do not cut it short.
  function settle(t, fn) {
    let last = -1, still = 0;
    const t0 = performance.now();
    const step = () => {
      if (t !== tok) return;
      const key = Math.round(window.scrollY) + ':' + (target ? Math.round(target.getBoundingClientRect().top) : 0);
      still = key === last ? still + 1 : 0;
      last = key;
      if (still >= 6 || performance.now() - t0 > 2500) fn(); else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }
  function playLine(n) {
    clearTimers();
    const t = ++tok;
    lineIdx = n; phase = 'line';
    const line = lines[n];
    g.len = line.text.length; g.started = false; g.final = false; g.b = 0;
    renderLine(n);
    if (n === 0) anchor = target;
    else { if (!items) items = itemsIn(target); anchor = pick(n); if (!isTop()) reveal(anchor); }
    if (voiceOn && canSpeak && !speechBroken) speakLine(t, n, line); else timerLine(t, n, line);
  }
  function timerLine(t, n, line) {
    g.mode = 'timer'; g.t0 = performance.now(); g.dur = Math.max(1200, line.text.length / READ_CPS * 1000);
    click();
    later(() => lineDone(t, n), g.dur);
  }
  function speakLine(t, n, line) {
    let u;
    try { u = new SpeechSynthesisUtterance(line.text); } catch (e) { timerLine(t, n, line); return; }
    pickVoices();
    const nia = line.who === 'NIA', v = nia ? cast.nia : cast.obi;
    if (v) { u.voice = v; u.lang = v.lang; } else u.lang = 'en-US';
    u.pitch = nia ? cast.niaPitch : cast.obiPitch;
    u.rate = nia ? 1.0 : 0.95;
    g.mode = 'speech'; g.cps = 14 * u.rate;
    const begin = () => { if (!g.started) { g.started = true; g.bt = performance.now(); click(); } };
    u.onstart = () => { if (t === tok) begin(); };
    u.onboundary = (e) => { if (t !== tok) return; begin(); g.b = Math.max(g.b, Math.min(g.len, e.charIndex || 0)); g.bt = performance.now(); };
    u.onend = () => { if (t === tok) lineDone(t, n); };
    u.onerror = (e) => {
      if (t !== tok) return;
      if (e && (e.error === 'interrupted' || e.error === 'canceled')) return;
      const t2 = ++tok; timerLine(t2, n, line);
    };
    keepUtt = u;
    try { synth.cancel(); } catch (e) {}
    later(() => { if (t !== tok) return; try { synth.speak(u); } catch (e) { const t2 = ++tok; timerLine(t2, n, line); } }, 40);
    // Some browsers expose speechSynthesis but never speak (no voices, blocked audio): fall back to reading time.
    later(() => {
      if (t !== tok || g.started) return;
      speechBroken = true;
      const t2 = ++tok; cancelSpeech(); timerLine(t2, n, line);
    }, 3500);
  }
  function lineDone(t, n) {
    if (t !== tok) return;
    clearTimers();
    g.done += g.len;
    g.mode = 'idle'; g.started = false; g.b = 0;
    const t2 = ++tok;
    if (n + 1 < lines.length) {
      lineIdx = n + 1;
      later(() => { if (t2 === tok) playLine(n + 1); }, 120);
    } else {
      g.final = true; setFill(1); phase = 'after';
      later(() => { if (t2 === tok) advance(); }, PAUSE_AFTER);
    }
  }
  const advance = () => (idx + 1 < list.length ? startStop(idx + 1) : end());
  function go(k) { if (k >= list.length) end(); else startStop(Math.max(0, k)); }
  function setPaused(p) {
    paused = p;
    btnPause.textContent = p ? 'Resume' : 'Pause';
    btnPause.setAttribute('aria-pressed', String(p));
    panel.classList.toggle('is-paused', p);
    if (p) { tok++; clearTimers(); cancelSpeech(); }
    else if (phase === 'after') advance();
    else playLine(lineIdx);
  }

  // ---- Docking: the panel is a fixed left column and the page reflows beside it (html.tour-on adds the padding);
  // under 700px it is a strip at the top and the page is pushed down by its measured height.
  function syncStrip() { if (running) html.style.setProperty('--tour-strip', Math.ceil(panel.getBoundingClientRect().height) + 'px'); }
  let ro = null;
  try { ro = new ResizeObserver(syncStrip); } catch (e) { ro = null; }
  function start() {
    list = adapter.stops();
    if (!list.length) return;
    running = true; speechBroken = false;
    panel.hidden = false; cursor.hidden = false;
    if (launch) launch.hidden = true;
    html.classList.add('tour-on');
    syncStrip();
    if (ro) ro.observe(panel);
    paused = false;
    btnPause.textContent = 'Pause';
    btnPause.setAttribute('aria-pressed', 'false');
    panel.classList.remove('is-paused');
    const a = area();
    cx = a.l + 24; cy = isTop() ? a.t + 24 : innerHeight * 0.45;
    if (!raf) raf = requestAnimationFrame(frame);
    startStop(0);
    try { btnPause.focus({ preventScroll: true }); } catch (e) {}
  }
  function end() {
    if (!running) return;
    running = false; paused = false; tok++;
    clearTimers(); cancelSpeech();
    if (raf) cancelAnimationFrame(raf);
    raf = 0;
    if (ro) ro.disconnect();
    html.classList.remove('tour-on');
    html.style.removeProperty('--tour-strip');
    if (target) target.classList.remove('tour-target');
    target = null; anchor = null; items = null;
    panel.hidden = true; cursor.hidden = true;
    if (launch) { launch.hidden = false; try { launch.focus({ preventScroll: true }); } catch (e) {} }
  }

  if (launch) launch.addEventListener('click', () => (running ? end() : start()));
  btnBack.addEventListener('click', () => go(idx - 1));
  btnNext.addEventListener('click', () => go(idx + 1));
  btnPause.addEventListener('click', () => setPaused(!paused));
  btnClose.addEventListener('click', end);
  btnVoice.addEventListener('click', () => {
    if (!canSpeak) return;
    voiceOn = !voiceOn; speechBroken = false; paintVoice();
    try { localStorage.setItem('tour-voice', voiceOn ? 'on' : 'off'); } catch (e) {}
    if (running && !paused && phase === 'line') { tok++; clearTimers(); cancelSpeech(); playLine(lineIdx); }
  });
  const typing = (el) => !!el && (el.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName || ''));
  window.addEventListener('keydown', (e) => {
    if (!running || typing(e.target) || e.altKey || e.ctrlKey || e.metaKey) return;
    let used = true;
    if (e.key === 'ArrowRight') go(idx + 1);
    else if (e.key === 'ArrowLeft') go(idx - 1);
    else if (e.key === ' ' || e.key === 'Spacebar') { if (!e.repeat) setPaused(!paused); }
    else if (e.key === 'Escape') end();
    else used = false;
    if (used) { e.preventDefault(); e.stopPropagation(); }
  }, true);
  window.addEventListener('keyup', (e) => { if (running && (e.key === ' ' || e.key === 'Spacebar') && !typing(e.target)) { e.preventDefault(); e.stopPropagation(); } }, true);
  addEventListener('resize', syncStrip);
  if (mode === 'deck') window.__deckOnShow = (n) => { if (running && !bringing && n !== idx) startStop(n); };
  window.__tour = { start, end, state: () => ({ running, paused, idx, lineIdx, phase, count: list.length, lines: lines.length, voice: cast.obi && cast.obi.name, nia: cast.nia && cast.nia.name, obiPitch: cast.obiPitch, niaPitch: cast.niaPitch }) };
})();
</script>
