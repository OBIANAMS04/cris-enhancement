<!-- Guided tour. Standing rule (Obi, 2026-11-10): every framework page, artifact and presentation carries a red
     "Take the guided tour" button. Paste this block at the end of a page, then mark each stop with
     data-tour="Step text" (and optionally data-tour-title="Short title") on the element to point at.
     Steps run in document order. No libraries; works in light and dark; keyboard: Enter/arrows to move, Esc to close. -->
<style>
:root { --tour-red: #c8102e; --tour-red-ink: #ffffff; --tour-card: #ffffff; --tour-ink: #1b1d21; --tour-muted: #5a606b; --tour-shade: rgba(10, 12, 16, 0.55); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --tour-red: #ff5a6e; --tour-red-ink: #1a0a0d; --tour-card: #1f2329; --tour-ink: #eceef2; --tour-muted: #a3aab6; --tour-shade: rgba(0, 0, 0, 0.65); } }
:root[data-theme="dark"] { --tour-red: #ff5a6e; --tour-red-ink: #1a0a0d; --tour-card: #1f2329; --tour-ink: #eceef2; --tour-muted: #a3aab6; --tour-shade: rgba(0, 0, 0, 0.65); }
.tour-launch { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50;
  font: 700 15px/1 system-ui, "Segoe UI", sans-serif; color: var(--tour-red-ink); background: var(--tour-red); border: 0; border-radius: 999px;
  padding: 13px 20px; min-height: 44px; cursor: pointer; box-shadow: 0 6px 18px rgba(0, 0, 0, 0.22); }
.tour-launch:hover { filter: brightness(1.08); }
.tour-launch:focus-visible, .tour-card button:focus-visible { outline: 3px solid var(--tour-ink); outline-offset: 3px; }
.tour-launch[hidden], .tour-layer[hidden] { display: none !important; }
[data-tour] { scroll-margin-top: 72px; }
.tour-layer { position: fixed; inset: 0; z-index: 60; }
.tour-hole { position: fixed; border-radius: 8px; box-shadow: 0 0 0 9999px var(--tour-shade); outline: 3px solid var(--tour-red); pointer-events: none; }
.tour-card { position: fixed; width: min(360px, calc(100vw - 32px)); background: var(--tour-card); color: var(--tour-ink); border-radius: 12px; padding: 16px 18px;
  box-shadow: 0 12px 32px rgba(0, 0, 0, 0.3); border-top: 5px solid var(--tour-red); font: 15px/1.5 system-ui, "Segoe UI", sans-serif; }
.tour-card h3 { margin: 0 0 6px; font-size: 1.05rem; }
.tour-card p { margin: 0 0 12px; }
.tour-count { font-size: 0.8rem; color: var(--tour-muted); }
.tour-nav { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.tour-nav div { display: flex; gap: 8px; }
.tour-card button { font: 600 14px/1 system-ui, "Segoe UI", sans-serif; border-radius: 8px; padding: 9px 14px; min-height: 38px; cursor: pointer; border: 1px solid var(--tour-muted); background: transparent; color: var(--tour-ink); }
.tour-card button.tour-next { background: var(--tour-red); color: var(--tour-red-ink); border-color: var(--tour-red); }
@media (prefers-reduced-motion: no-preference) { .tour-hole, .tour-card { transition: all 0.2s ease; } }
</style>
<button type="button" class="tour-launch" id="tour-launch" aria-haspopup="dialog">Take the guided tour</button>
<div class="tour-layer" id="tour-layer" hidden>
  <div class="tour-hole" id="tour-hole"></div>
  <div class="tour-card" id="tour-card" role="dialog" aria-modal="true" aria-labelledby="tour-title" aria-describedby="tour-text">
    <h3 id="tour-title"></h3>
    <p id="tour-text"></p>
    <div class="tour-nav">
      <span class="tour-count" id="tour-count"></span>
      <div>
        <button type="button" id="tour-back">Back</button>
        <button type="button" class="tour-next" id="tour-next">Next</button>
        <button type="button" id="tour-close" aria-label="Close the tour">Close</button>
      </div>
    </div>
  </div>
</div>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const layer = $('tour-layer'), hole = $('tour-hole'), cardEl = $('tour-card'), launch = $('tour-launch');
  const steps = () => [...document.querySelectorAll('[data-tour]')].filter((el) => el.getClientRects().length);
  let list = [], i = 0;
  const place = () => {
    const el = list[i];
    if (!el) return;
    // Highlight only the part of the element that is on screen, and keep the card inside the screen.
    const r = el.getBoundingClientRect(), pad = 6, edge = 12;
    const top = Math.max(r.top, edge), bottom = Math.min(r.bottom, innerHeight - edge);
    Object.assign(hole.style, { top: `${top - pad}px`, left: `${Math.max(r.left, edge) - pad}px`, width: `${Math.min(r.width, innerWidth - 2 * edge) + pad * 2}px`, height: `${Math.max(bottom - top, 24) + pad * 2}px` });
    const c = cardEl.getBoundingClientRect();
    const fitsBelow = bottom + 16 + c.height <= innerHeight - edge;
    const fitsAbove = top - 16 - c.height >= edge;
    let y = fitsBelow ? bottom + 16 : fitsAbove ? top - 16 - c.height : innerHeight - c.height - edge;
    y = Math.max(edge, Math.min(y, innerHeight - c.height - edge));
    cardEl.style.top = `${y}px`;
    cardEl.style.left = `${Math.max(edge, Math.min(r.left, innerWidth - c.width - edge))}px`;
  };
  const show = (n) => {
    i = Math.max(0, Math.min(n, list.length - 1));
    const el = list[i];
    $('tour-title').textContent = el.dataset.tourTitle || el.querySelector('h1, h2, h3')?.textContent || `Stop ${i + 1}`;
    $('tour-text').textContent = el.dataset.tour;
    $('tour-count').textContent = `${i + 1} of ${list.length}`;
    $('tour-back').disabled = i === 0;
    $('tour-next').textContent = i === list.length - 1 ? 'Finish' : 'Next';
    el.scrollIntoView({ block: 'start', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    setTimeout(place, 260);
    place();
    $('tour-next').focus();
  };
  const close = () => { layer.hidden = true; launch.hidden = false; launch.focus(); };
  launch.addEventListener('click', () => {
    list = steps();
    if (!list.length) return;
    layer.hidden = false; launch.hidden = true; show(0);
  });
  $('tour-next').addEventListener('click', () => (i === list.length - 1 ? close() : show(i + 1)));
  $('tour-back').addEventListener('click', () => show(i - 1));
  $('tour-close').addEventListener('click', close);
  layer.addEventListener('click', (e) => { if (e.target === layer) close(); });
  addEventListener('keydown', (e) => {
    if (layer.hidden) return;
    if (e.key === 'Escape') close();
    else if (e.key === 'ArrowRight') show(i + 1);
    else if (e.key === 'ArrowLeft') show(i - 1);
  });
  addEventListener('resize', () => !layer.hidden && place());
  addEventListener('scroll', () => !layer.hidden && place(), { passive: true });
})();
</script>
