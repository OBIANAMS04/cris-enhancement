<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>CRIS recording</title>
<style>html,body{margin:0;height:100%;background:#000}video{width:100vw;height:100vh;object-fit:contain;display:block}</style>
</head><body>
<!-- Plays one produced video full-window, for screen sharing into a portal practice room. ?v=<name>  -->
<video id="v" preload="auto" playsinline></video>
<script>
  var v = document.getElementById('v');
  v.src = '../videos/' + (new URLSearchParams(location.search).get('v') || 'prep-1-project-introduction') + '.webm';
  window.playIt = function () { v.currentTime = 0; return v.play(); };
</script>
</body></html>
